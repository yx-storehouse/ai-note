<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能笔记 AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
            },
            colors: {
              // Monochrome Palette
              background: '#050505',
              surface: '#111111',
              surfaceHighlight: '#1A1A1A',
              border: '#2A2A2A',
              borderHighlight: '#444444',
              textMain: '#EDEDED',
              textMuted: '#888888',
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Dot Grid Background Pattern */
      .bg-dot-pattern {
        background-color: #050505;
        background-image: radial-gradient(#2A2A2A 1px, transparent 1px);
        background-size: 24px 24px;
      }
      
      /* Subtle Vignette */
      .vignette {
        background: radial-gradient(circle at center, transparent 0%, #050505 100%);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #050505; 
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body class="bg-background text-textMain antialiased h-screen overflow-hidden selection:bg-white selection:text-black">
    <div id="root" class="h-full"></div>
  </body>
</html>
