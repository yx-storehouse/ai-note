name = "ai-note"
main = "./worker/index.ts"
# 不能晚于 @cloudflare/vite-plugin 自带的 workerd 版本
compatibility_date = "2026-10-01"
# 部署时保留在 Dashboard 中设置的明文变量
keep_vars = true

[assets]
# 静态资源目录由 @cloudflare/vite-plugin 在构建时自动写入（dist/client），这里不要设置 directory
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# 环境变量（在 Dashboard → Workers & Pages → ai-note → Settings → Variables and Secrets 中配置，
# 或使用 `npx wrangler secret put <NAME>`）：
#
#   必需（Secret）：
#     APP_PASSWORD      访问密码。未设置时所有 /api/* 返回 503
#     MIMO_API_KEY      小米 MiMo API Key
#
#   可选：
#     MIMO_MODEL_NAME   模型名称，默认 mimo-v2.6-flash
#     MIMO_API_URL      MiMo 接口地址，默认 https://api.xiaomimimo.com/v1/chat/completions
#     GITEE_TOKEN       Gitee 私人令牌（Secret，需 gists 权限），启用云同步
#     GITEE_GIST_ID     存放笔记的 Gist ID，留空则首次上传时自动创建
#     GITEE_API_BASE    Gitee API 地址，默认 https://gitee.com/api/v5
#
# 本地开发时，把同名变量写进 .dev.vars（参考 .dev.vars.example）。
